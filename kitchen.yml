---
driver:
  name: dokken
  chef_version: <%= ENV['CHEF_VERSION'] || 'current' %>
  use_sudo: false
  # Never privileged: a privileged container gets the host /dev, so the
  # lightdm/Xorg started by agent_build_tools takes over the host VT, screen
  # and keyboard. systemd as PID 1 only needs SYS_ADMIN, a writable cgroup
  # (see pid_one_command) and no AppArmor confinement, since docker-default
  # denies the mount(2) calls systemd uses to sandbox generators and units.
  # NET_ADMIN lets the docker.io installed by agent_build_tools set up its
  # iptables rules, inside the container network namespace only.
  # Device access stays blocked by the docker device cgroup.
  privileged: false
  cap_add:
    - SYS_ADMIN
    - NET_ADMIN
  security_opt:
    - apparmor=unconfined
  env:
    - CHEF_LICENSE=accept

transport:
  name: dokken

provisioner:
  name: dokken
  chef_binary: /opt/chef/bin/chef-solo
  chef_options: "-Etest"
  chef_log_level: debug
  chef_output_format: doc

platforms:
  - name: ubuntu-24.04
    driver:
      image: dokken/ubuntu-24.04
      # Docker mounts the cgroup read-only unless privileged. In a private
      # cgroup namespace the mount only shows the container's own subtree,
      # so remount it read-write for systemd. Refuse to run otherwise: with
      # the host namespace this would expose the host cgroup tree.
      pid_one_command: >-
        sh -c 'grep -qx 0::/ /proc/self/cgroup
        || { echo "kitchen: needs a private cgroup namespace (cgroup v2)" >&2;
        exit 1; };
        mount -o remount,rw /sys/fs/cgroup && exec /bin/systemd'
      intermediate_instructions:
        - RUN /usr/bin/apt-get update
        - RUN /usr/bin/apt-get install -y pciutils

verifier:
  name: inspec

suites:
  - name: agent
    data_bags_path: "test/integration/data_bags"
    run_list:
      - recipe[osrf_jenkins_agent]
    verifier:
      inspec_tests:
        - test/integration/agent
        - test/integration/build_tools
        - test/integration/x11_support
  - name: agent-only
    data_bags_path: "test/integration/data_bags"
    run_list:
      - recipe[osrf_jenkins_agent]
    attributes:
      'osrfbuild':
        'agent':
          'install_agent_build_setup': false
          'nodename': "my_custom_name"
    verifier:
      inspec_tests:
        - test/integration/agent
        - test/integration/x11_no_support
        - test/integration/my_custom_name
  - name: gpu-agent
    data_bags_path: "test/integration/data_bags"
    run_list:
      - recipe[osrf_jenkins_agent]
    attributes:
      'gpu_devices':
        '0d:00.0':
          slot: '0d:00.0'
          class: VGA compatible controller
          vendor: mock NVIDIA
          device: mock TU104GL [Tesla T4]
          svendor: mock NVIDIA
          sdevice: mock TU104GL [Tesla T4]
          physlot: '30'
          rev: a1
    verifier:
      inspec_tests:
        - test/integration/agent
        - test/integration/build_tools
        - test/integration/x11_support
