---
name: main

"on":
  pull_request:
  push:

jobs:
  yamllint:
    runs-on: ubuntu-latest
    steps:
      - name: check out code
        uses: actions/checkout@main
      - name: run yaml lint
        uses: actionshub/yamllint@main
  test:
    runs-on: ubuntu-24.04
    name: 24.04 (${{ matrix.suite }} \
          chef ${{ matrix.chef_version }})
    strategy:
      matrix:
        suite:
          - 'agent'
          - 'agent-only'
          - 'gpu-agent'
        chef_version:
          - '16'
          - '17'
      fail-fast: false
    steps:
      - name: check out code
        uses: actions/checkout@v3.0.0
      # chef-install pinned to actionshub/chef-install@main (2026-05-13);
      # v3.0.1 hardcodes omnitruck.chef.io which now requires a license.
      - name: install chef
        uses: actionshub/chef-install@f3b35943a257c25f3ca69e3b773fa4e0e99b58d6
        with:
          project: cinc-workstation
          version: '25'
      # test-kitchen pinned to actionshub/test-kitchen v3.0.0
      - name: test-kitchen
        uses: actionshub/test-kitchen@6e6b61feb197118be2cbbb39795c6b089afe17b5
        with:
          suite: ${{ matrix.suite }}
          os: 'ubuntu-2404'
        env:
          CHEF_LICENSE: accept-no-persist
          CHEF_VERSION: ${{ matrix.chef_version }}
          KITCHEN_LOCAL_YAML: kitchen.yml
      - name: Print debug output (lightdm)
        if: failure()
        run: |
            set -x
            KITCHEN_LOCAL_YAML=kitchen.dokken.yml /usr/bin/kitchen exec \
                ${{ matrix.suite }}-${{ matrix.os }} \
                -c "cat /var/log/lightdm/lightdm.log"
      - name: Print debug output on failure (X.log)
        if: failure()
        run: |
            set -x
            KITCHEN_LOCAL_YAML=kitchen.dokken.yml /usr/bin/kitchen exec \
                ${{ matrix.suite }}-${{ matrix.os }} \
                -c "cat /var/log/Xorg.0.log"
      - name: Print debug output on failure (systemctl lightdm status)
        if: failure()
        run: |
            set -x
            KITCHEN_LOCAL_YAML=kitchen.dokken.yml /usr/bin/kitchen exec \
                ${{ matrix.suite }}-${{ matrix.os }} \
                -c "journalctl -u lightdm"
      - name: Print debug output on failure (systemctl jenkins-agent status)
        if: failure()
        run: |
            set -x
            KITCHEN_LOCAL_YAML=kitchen.dokken.yml /usr/bin/kitchen exec \
                ${{ matrix.suite }}-${{ matrix.os }} \
                -c "journalctl -u jenkins-agent"
